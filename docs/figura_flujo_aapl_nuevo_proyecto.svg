<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="4300" viewBox="0 0 1400 4300">
  <defs>
    <style>
      .bg { fill: #0b0b0f; }
      .box { fill: #ffffff; stroke: #d7d9ff; stroke-width: 2; rx: 10; ry: 10; }
      .decision { fill: #ffffff; stroke: #d7d9ff; stroke-width: 2; }
      .side { fill: #f6f7ff; stroke: #b6bae6; stroke-width: 2; rx: 10; ry: 10; }
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #f2f3ff; }
      .subtitle { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #cfd3ff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1a1d28; text-anchor: middle; }
      .label { font: 12px 'Segoe UI', Arial, sans-serif; fill: #f2f3ff; }
      .arrow { stroke: #d7d9ff; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .link { stroke: #8e93c9; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead2); stroke-dasharray: 8 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#d7d9ff" />
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#8e93c9" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="4300" />

  <text x="700" y="42" class="title">Flujo completo del nuevo proyecto</text>
  <text x="700" y="70" class="subtitle">Ejemplo trazado: "Dame una vision general de AAPL en 3 meses"</text>

  <rect class="box" x="470" y="95" width="460" height="72" />
  <text x="700" y="126" class="text">
    <tspan x="700" dy="0">Usuario pregunta</tspan>
    <tspan x="700" dy="18">Dame una vision general de AAPL en 3 meses</tspan>
  </text>

  <rect class="box" x="470" y="200" width="460" height="86" />
  <text x="700" y="229" class="text">
    <tspan x="700" dy="0">FinancialQueryInput</tspan>
    <tspan x="700" dy="18">query = texto original</tspan>
    <tspan x="700" dy="18">sin ticker ni fechas resueltas todavia</tspan>
  </text>

  <rect class="box" x="470" y="320" width="460" height="102" />
  <text x="700" y="349" class="text">
    <tspan x="700" dy="0">WorkflowState inicial</tspan>
    <tspan x="700" dy="18">status = created</tspan>
    <tspan x="700" dy="18">normalized_query = {"query": ...}</tspan>
    <tspan x="700" dy="18">csv_paths = [] | warnings = []</tspan>
  </text>

  <line class="arrow" x1="700" y1="167" x2="700" y2="200" />
  <line class="arrow" x1="700" y1="286" x2="700" y2="320" />

  <rect class="box" x="555" y="460" width="290" height="50" />
  <text x="700" y="491" class="text">ingest_node</text>
  <line class="arrow" x1="700" y1="422" x2="700" y2="460" />

  <rect class="box" x="500" y="545" width="400" height="84" />
  <text x="700" y="574" class="text">
    <tspan x="700" dy="0">validate_input / validate_query_input</tspan>
    <tspan x="700" dy="18">Comprueba que la consulta no este vacia</tspan>
    <tspan x="700" dy="18">si pasa -&gt; status = ingested</tspan>
  </text>
  <line class="arrow" x1="700" y1="510" x2="700" y2="545" />

  <polygon class="decision" points="700,680 800,780 700,880 600,780" />
  <text x="700" y="776" class="text">
    <tspan x="700" dy="0">Entrada</tspan>
    <tspan x="700" dy="18">valida?</tspan>
  </text>
  <line class="arrow" x1="700" y1="629" x2="700" y2="680" />
  <text x="817" y="785" class="label">Si</text>
  <text x="545" y="785" class="label">No</text>

  <rect class="side" x="120" y="738" width="310" height="74" />
  <text x="275" y="768" class="text">
    <tspan x="275" dy="0">invalid_request_node</tspan>
    <tspan x="275" dy="18">status = invalid</tspan>
    <tspan x="275" dy="18">final_answer = error</tspan>
  </text>
  <line class="arrow" x1="600" y1="780" x2="430" y2="780" />

  <rect class="box" x="470" y="930" width="460" height="88" />
  <text x="700" y="960" class="text">
    <tspan x="700" dy="0">data_request_planning_node</tspan>
    <tspan x="700" dy="18">Agente 1 - Planificador de datos</tspan>
    <tspan x="700" dy="18">Convierte consulta libre en FinancialDataRequest</tspan>
  </text>
  <line class="arrow" x1="700" y1="880" x2="700" y2="930" />

  <rect class="box" x="470" y="1052" width="460" height="120" />
  <text x="700" y="1080" class="text">
    <tspan x="700" dy="0">FinancialDataRequest</tspan>
    <tspan x="700" dy="18">provider = yfinance | ticker = AAPL</tspan>
    <tspan x="700" dy="18">period = 3mo | interval = 1d</tspan>
    <tspan x="700" dy="18">required_fields = Open, High, Low, Close...</tspan>
    <tspan x="700" dy="18">status = data_request_planned</tspan>
  </text>
  <line class="arrow" x1="700" y1="1018" x2="700" y2="1052" />

  <rect class="box" x="470" y="1208" width="460" height="82" />
  <text x="700" y="1238" class="text">
    <tspan x="700" dy="0">Validacion estructural</tspan>
    <tspan x="700" dy="18">validate_financial_data_request_structure</tspan>
    <tspan x="700" dy="18">request formalmente correcto?</tspan>
  </text>
  <line class="arrow" x1="700" y1="1172" x2="700" y2="1208" />

  <polygon class="decision" points="700,1338 800,1438 700,1538 600,1438" />
  <text x="700" y="1434" class="text">
    <tspan x="700" dy="0">Request</tspan>
    <tspan x="700" dy="18">valido?</tspan>
  </text>
  <line class="arrow" x1="700" y1="1290" x2="700" y2="1338" />
  <text x="817" y="1443" class="label">Si</text>
  <text x="546" y="1443" class="label">No</text>

  <rect class="side" x="85" y="1396" width="345" height="86" />
  <text x="257" y="1426" class="text">
    <tspan x="257" dy="0">Subagente 1</tspan>
    <tspan x="257" dy="18">Reparador estructural</tspan>
    <tspan x="257" dy="18">corrige provider, ticker, periodo, fechas...</tspan>
  </text>
  <line class="arrow" x1="600" y1="1438" x2="430" y2="1438" />
  <path class="link" d="M257 1482 C257 1540, 410 1540, 470 1249" />

  <rect class="box" x="470" y="1588" width="460" height="84" />
  <text x="700" y="1618" class="text">
    <tspan x="700" dy="0">Descarga datos</tspan>
    <tspan x="700" dy="18">download_market_data desde yfinance</tspan>
    <tspan x="700" dy="18">status = data_request_validated</tspan>
  </text>
  <line class="arrow" x1="700" y1="1538" x2="700" y2="1588" />

  <rect class="box" x="470" y="1706" width="460" height="82" />
  <text x="700" y="1736" class="text">
    <tspan x="700" dy="0">Normalizacion</tspan>
    <tspan x="700" dy="18">normalize_downloaded_data</tspan>
    <tspan x="700" dy="18">DataFrame canonico: Date, Ticker, Open... Close</tspan>
  </text>
  <line class="arrow" x1="700" y1="1672" x2="700" y2="1706" />

  <rect class="box" x="470" y="1822" width="460" height="84" />
  <text x="700" y="1852" class="text">
    <tspan x="700" dy="0">Validacion operativa de descarga</tspan>
    <tspan x="700" dy="18">validate_operational_download(request, normalized)</tspan>
    <tspan x="700" dy="18">hay filas, columnas minimas y ticker esperado?</tspan>
  </text>
  <line class="arrow" x1="700" y1="1788" x2="700" y2="1822" />

  <polygon class="decision" points="700,1956 800,2056 700,2156 600,2056" />
  <text x="700" y="2052" class="text">
    <tspan x="700" dy="0">Descarga</tspan>
    <tspan x="700" dy="18">valida?</tspan>
  </text>
  <line class="arrow" x1="700" y1="1906" x2="700" y2="1956" />
  <text x="817" y="2061" class="label">Si</text>
  <text x="546" y="2061" class="label">No</text>

  <rect class="side" x="70" y="2012" width="360" height="86" />
  <text x="250" y="2042" class="text">
    <tspan x="250" dy="0">Subagente 2</tspan>
    <tspan x="250" dy="18">Reparador operativo</tspan>
    <tspan x="250" dy="18">corrige tickers, rango o restricciones de descarga</tspan>
  </text>
  <line class="arrow" x1="600" y1="2056" x2="430" y2="2056" />
  <path class="link" d="M250 2098 C250 2160, 400 2160, 470 1629" />

  <rect class="box" x="470" y="2204" width="460" height="116" />
  <text x="700" y="2232" class="text">
    <tspan x="700" dy="0">Persistencia y handoff de datos</tspan>
    <tspan x="700" dy="18">status = data_downloaded</tspan>
    <tspan x="700" dy="18">csv_paths = [normalized_...csv]</tspan>
    <tspan x="700" dy="18">download_summary = provider, tickers, row_count, columns</tspan>
    <tspan x="700" dy="18">normalized_query ya enriquecida</tspan>
  </text>
  <line class="arrow" x1="700" y1="2156" x2="700" y2="2204" />

  <rect class="side" x="975" y="2206" width="320" height="112" />
  <text x="1135" y="2235" class="text">
    <tspan x="1135" dy="0">Artefactos de datos</tspan>
    <tspan x="1135" dy="18">request_....json</tspan>
    <tspan x="1135" dy="18">raw_....csv</tspan>
    <tspan x="1135" dy="18">normalized_....csv</tspan>
    <tspan x="1135" dy="18">raw_....metadata.json</tspan>
  </text>
  <line class="arrow" x1="930" y1="2262" x2="975" y2="2262" />

  <rect class="box" x="470" y="2358" width="460" height="84" />
  <text x="700" y="2388" class="text">
    <tspan x="700" dy="0">llm_analysis_node</tspan>
    <tspan x="700" dy="18">Agente 2 - Analista</tspan>
    <tspan x="700" dy="18">recibe query + Phase2PromptContext</tspan>
  </text>
  <line class="arrow" x1="700" y1="2320" x2="700" y2="2358" />

  <rect class="box" x="470" y="2478" width="460" height="102" />
  <text x="700" y="2508" class="text">
    <tspan x="700" dy="0">AnalysisPlan</tspan>
    <tspan x="700" dy="18">analysis_type = historical_overview</tspan>
    <tspan x="700" dy="18">metricas: ultimo_cierre, variacion_total</tspan>
    <tspan x="700" dy="18">status = planned</tspan>
  </text>
  <line class="arrow" x1="700" y1="2442" x2="700" y2="2478" />

  <rect class="box" x="470" y="2616" width="460" height="84" />
  <text x="700" y="2646" class="text">
    <tspan x="700" dy="0">code_generation_node</tspan>
    <tspan x="700" dy="18">Agente 3 - Generador de codigo</tspan>
    <tspan x="700" dy="18">script Python a partir del plan</tspan>
  </text>
  <line class="arrow" x1="700" y1="2580" x2="700" y2="2616" />

  <rect class="box" x="470" y="2734" width="460" height="84" />
  <text x="700" y="2764" class="text">
    <tspan x="700" dy="0">generated_code</tspan>
    <tspan x="700" dy="18">status = code_generated</tspan>
    <tspan x="700" dy="18">script listo para validacion estatica</tspan>
  </text>
  <line class="arrow" x1="700" y1="2700" x2="700" y2="2734" />

  <rect class="box" x="470" y="2852" width="460" height="84" />
  <text x="700" y="2882" class="text">
    <tspan x="700" dy="0">code_validation_node</tspan>
    <tspan x="700" dy="18">Agente 4 - Validador de codigo</tspan>
    <tspan x="700" dy="18">imports, estructura, contrato de salida</tspan>
  </text>
  <line class="arrow" x1="700" y1="2818" x2="700" y2="2852" />

  <polygon class="decision" points="700,2988 800,3088 700,3188 600,3088" />
  <text x="700" y="3084" class="text">
    <tspan x="700" dy="0">Codigo</tspan>
    <tspan x="700" dy="18">valido?</tspan>
  </text>
  <line class="arrow" x1="700" y1="2936" x2="700" y2="2988" />
  <text x="817" y="3093" class="label">Si</text>
  <text x="546" y="3093" class="label">No</text>

  <rect class="side" x="70" y="3044" width="360" height="86" />
  <text x="250" y="3074" class="text">
    <tspan x="250" dy="0">Subagente 3</tspan>
    <tspan x="250" dy="18">Reparador de codigo estatico</tspan>
    <tspan x="250" dy="18">corrige formato, imports y estructura</tspan>
  </text>
  <line class="arrow" x1="600" y1="3088" x2="430" y2="3088" />
  <path class="link" d="M250 3130 C250 3195, 415 3195, 470 2894" />

  <rect class="box" x="975" y="3032" width="320" height="110" />
  <text x="1135" y="3060" class="text">
    <tspan x="1135" dy="0">code_validated</tspan>
    <tspan x="1135" dy="18">decision = valid</tspan>
    <tspan x="1135" dy="18">generated_code aceptado</tspan>
    <tspan x="1135" dy="18">pasa a ejecucion real</tspan>
  </text>
  <line class="arrow" x1="800" y1="3088" x2="975" y2="3088" />

  <rect class="box" x="975" y="3180" width="320" height="84" />
  <text x="1135" y="3210" class="text">
    <tspan x="1135" dy="0">code_execution_node</tspan>
    <tspan x="1135" dy="18">Ejecutor de codigo</tspan>
    <tspan x="1135" dy="18">payload = Phase2PromptContext</tspan>
  </text>
  <line class="arrow" x1="1135" y1="3142" x2="1135" y2="3180" />

  <rect class="box" x="975" y="3300" width="320" height="84" />
  <text x="1135" y="3330" class="text">
    <tspan x="1135" dy="0">run_generated_code</tspan>
    <tspan x="1135" dy="18">proceso aislado + validacion de salida</tspan>
    <tspan x="1135" dy="18">returncode == 0 y JSON util?</tspan>
  </text>
  <line class="arrow" x1="1135" y1="3264" x2="1135" y2="3300" />

  <rect class="side" x="70" y="3288" width="390" height="108" />
  <text x="265" y="3318" class="text">
    <tspan x="265" dy="0">Artefactos de ejecucion</tspan>
    <tspan x="265" dy="18">generated_....py</tspan>
    <tspan x="265" dy="18">payload_....json</tspan>
    <tspan x="265" dy="18">stdout_....json | stderr_....log</tspan>
    <tspan x="265" dy="18">evidencia real para depuracion y reparacion</tspan>
  </text>
  <line class="arrow" x1="975" y1="3342" x2="460" y2="3342" />

  <polygon class="decision" points="1135,3436 1235,3536 1135,3636 1035,3536" />
  <text x="1135" y="3530" class="text">
    <tspan x="1135" dy="0">Ejecucion</tspan>
    <tspan x="1135" dy="18">valida?</tspan>
  </text>
  <line class="arrow" x1="1135" y1="3384" x2="1135" y2="3436" />
  <text x="1250" y="3541" class="label">Si</text>
  <text x="978" y="3541" class="label">No</text>

  <rect class="side" x="620" y="3490" width="330" height="88" />
  <text x="785" y="3520" class="text">
    <tspan x="785" dy="0">Subagente 4</tspan>
    <tspan x="785" dy="18">Reparador de errores de ejecucion</tspan>
    <tspan x="785" dy="18">corrige el script usando stderr y logs reales</tspan>
  </text>
  <line class="arrow" x1="1035" y1="3536" x2="950" y2="3536" />
  <path class="link" d="M785 3578 C785 3660, 1030 3660, 1135 3222" />

  <rect class="box" x="975" y="3690" width="320" height="116" />
  <text x="1135" y="3718" class="text">
    <tspan x="1135" dy="0">execution_output</tspan>
    <tspan x="1135" dy="18">metrics + summary + limitations</tspan>
    <tspan x="1135" dy="18">execution_returncode = 0</tspan>
    <tspan x="1135" dy="18">status = executed</tspan>
  </text>
  <line class="arrow" x1="1135" y1="3636" x2="1135" y2="3690" />

  <rect class="box" x="975" y="3842" width="320" height="84" />
  <text x="1135" y="3872" class="text">
    <tspan x="1135" dy="0">interpretation_node</tspan>
    <tspan x="1135" dy="18">Agente 5 - Interprete</tspan>
    <tspan x="1135" dy="18">payload limpio sin pistas internas</tspan>
  </text>
  <line class="arrow" x1="1135" y1="3806" x2="1135" y2="3842" />

  <rect class="box" x="975" y="3962" width="320" height="102" />
  <text x="1135" y="3992" class="text">
    <tspan x="1135" dy="0">final_answer</tspan>
    <tspan x="1135" dy="18">respuesta en lenguaje natural</tspan>
    <tspan x="1135" dy="18">basada en execution_output validada</tspan>
    <tspan x="1135" dy="18">status = completed</tspan>
  </text>
  <line class="arrow" x1="1135" y1="3926" x2="1135" y2="3962" />

  <rect class="box" x="975" y="4100" width="320" height="86" />
  <text x="1135" y="4130" class="text">
    <tspan x="1135" dy="0">WorkflowState final</tspan>
    <tspan x="1135" dy="18">query + contexto resuelto + artefactos</tspan>
    <tspan x="1135" dy="18">plan + codigo + salida + respuesta final</tspan>
  </text>
  <line class="arrow" x1="1135" y1="4064" x2="1135" y2="4100" />

  <rect class="box" x="975" y="4218" width="320" height="70" />
  <text x="1135" y="4250" class="text">
    <tspan x="1135" dy="0">Respuesta final al usuario</tspan>
    <tspan x="1135" dy="18">AAPL en 3 meses - resumen historico reciente</tspan>
  </text>
  <line class="arrow" x1="1135" y1="4186" x2="1135" y2="4218" />
</svg>
